name: 일일 광고 데이터 수집

on:
  schedule:
    # 매일 오전 1시 (KST) = UTC 16:00 (전날)
    - cron: "0 16 * * *"
  workflow_dispatch:   # 수동 실행 가능

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Homepage Supabase (UTM)
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
      CYCLEHACKERS_API:          ${{ secrets.CYCLEHACKERS_API }}
      REFRESH_TOKEN:             ${{ secrets.REFRESH_TOKEN }}
      # Analytics DB
      DB_SUPABASE_URL:           ${{ secrets.DB_SUPABASE_URL }}
      DB_SUPABASE_SERVICE_KEY:   ${{ secrets.DB_SUPABASE_SERVICE_KEY }}
      # Meta Ads
      META_ACCESS_TOKEN_A:       ${{ secrets.META_ACCESS_TOKEN_A }}
      META_ACCESS_TOKEN_B:       ${{ secrets.META_ACCESS_TOKEN_B }}
      META_AD_ACCOUNT_A:         ${{ secrets.META_AD_ACCOUNT_A }}
      META_AD_ACCOUNT_B:         ${{ secrets.META_AD_ACCOUNT_B }}
      META_AD_ACCOUNT_C:         ${{ secrets.META_AD_ACCOUNT_C }}
      # Google Ads
      GOOGLE_DEVELOPER_TOKEN:    ${{ secrets.GOOGLE_DEVELOPER_TOKEN }}
      GOOGLE_CLIENT_ID:          ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET:      ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN:      ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_MCC_ID:             ${{ secrets.GOOGLE_MCC_ID }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # ── UTM 수집 ────────────────────────────────────────────────────────
      - name: UTM 데이터 수집
        run: python collect_utm.py
        continue-on-error: true   # 한 스크립트 실패해도 다음 진행

      # ── refresh_token 자동 갱신 커밋 ────────────────────────────────────
      # collect_utm.py 실행 후 .refresh_token 파일이 갱신되면 레포에 저장
      - name: refresh_token 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .refresh_token
          git diff --staged --quiet || git commit -m "chore: UTM refresh_token 자동 갱신 [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Meta 수집 ────────────────────────────────────────────────────────
      - name: Meta 광고 데이터 수집
        run: python collect_meta.py
        continue-on-error: true

      # ── Google 수집 ─────────────────────────────────────────────────────
      - name: Google 광고 데이터 수집
        run: python collect_google.py
        continue-on-error: true

      - name: 수집 완료
        run: echo "데이터 수집 완료 - $(date '+%Y-%m-%d %H:%M:%S KST')"
